name: Docker Image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'ref to build'
        required: false
        default: 'main'
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
    branches:
    - "main"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout
      # Added so the workflow_dispatch "ref" input above actually does
      # something. Without a checkout step it was never read, and the build
      # fell back to the Git context of the triggering event — so dispatching
      # against a ref built main regardless.
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.ref || github.ref }}

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        # list of Docker images to use as base name for tags
        images: |
          yoanlin/bbgo
          quay.io/yoanlin/bbgo
        # generate Docker tags based on the following events/attributes
        tags: |
          type=ref,event=branch
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          type=sha

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to DockerHub
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to Quay Container Registry
      uses: docker/login-action@v4
      with:
        registry: quay.io
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_TOKEN }}

    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ steps.meta.outputs.tags }}
        # Layer cache: the Dockerfile compiles the whole of bbgo with CGO, and
        # without this every push to main rebuilds it from nothing.
        cache-from: type=gha
        cache-to: type=gha,mode=max
        # NOTE: QEMU and Buildx are set up above, which only makes sense for a
        # multi-architecture build, but no `platforms` is given — so this builds
        # for the runner's architecture alone and the two setup steps do
        # nothing. Adding `platforms: linux/amd64,linux/arm64` here is what the
        # setup implies was intended; it is left out deliberately because
        # building this image for arm64 under QEMU emulation is far slower than
        # the ~3 minutes the amd64-only build takes today, and that is a cost
        # decision rather than a fix.
