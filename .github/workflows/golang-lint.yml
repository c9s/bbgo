name: golang-lint
on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  golangci:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # golangci-lint-action manages its own analysis cache; this is just
          # the module cache for the build it has to do first.
          cache: true
      - name: golangci-lint
        # NOTE: .golangci.yml sets `issues-exit-code: 0`, so this step reports
        # findings but cannot fail. The green check it produces on every pull
        # request is therefore unconditional. Flipping that to 1 is a separate
        # decision, because the size of the existing backlog has not been
        # measured against the pinned v2.13.
        uses: golangci/golangci-lint-action@v9
        with:
          version: 'v2.13'
