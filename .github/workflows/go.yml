name: Go

on:
  push:
    branches:
    - "main"
  pull_request:

# Cancel an in-progress run when the branch is pushed again. Without this every
# push to a pull request starts another full ~8 minute run alongside the one it
# supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # The revive step reports through github-pr-review.
  pull-requests: write
  checks: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      matrix:
        redis-version:
        - "6.2"
        go-version:
        - "1.27"
    env:
      GITHUB_CI: true
      MYSQL_DATABASE: bbgo
      MYSQL_USER: "root"
      MYSQL_PASSWORD: "root" # pragma: allowlist secret

    steps:

    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: ${{ matrix.go-version }}
        # setup-go caches the module and build caches itself, keyed on both the
        # Go version and go.sum. The hand-rolled actions/cache step this
        # replaces keyed on go.sum alone, so a Go version bump silently reused
        # the previous version's build cache.
        cache: true

    - name: Set up MySQL
      run: |
        sudo /etc/init.d/mysql start
        mysql -e 'CREATE DATABASE ${{ env.MYSQL_DATABASE }};' -u${{ env.MYSQL_USER }} -p${{ env.MYSQL_PASSWORD }}

    - name: Set up redis
      uses: shogo82148/actions-setup-redis@v1
      with:
        redis-version: ${{ matrix.redis-version }}

    - name: Install Migration Tool
      # Pinned rather than @latest, so an upstream release cannot break this
      # repository's CI without a commit here. Kept at the same version as the
      # rockhopper/v2 require in go.mod, so the tool applying the migrations and
      # the library reading them do not drift apart. Dependabot's gomod updates
      # will not touch this line, so it needs bumping alongside go.mod.
      run: go install github.com/c9s/rockhopper/v2/cmd/rockhopper@v2.5.1

    - name: Test Migration SQL Files For MySQL
      run: rockhopper --config rockhopper_mysql.yaml up

    - name: Test Migration SQL Files For SQLite
      run: rockhopper --config rockhopper_sqlite.yaml up

    - name: Build
      run: go build -v ./cmd/bbgo

    - name: Link Market Data
      run: |
        mkdir -p ~/.bbgo/cache
        ln -s $PWD/data/binance-markets.json ~/.bbgo/cache/binance-markets.json
        touch data/binance-markets.json

    - name: Test
      # Kept at three runs on pull requests as well as on main. Dropping pull
      # requests to one was measured and bought nothing: the Test step is
      # dominated by compiling the test binaries under -race, not by executing
      # them, so the two extra repeats are close to free. Measured on this
      # repository, -count 1 took 4m12s against 3m57s for -count 3, the
      # difference being cache warmth rather than the repeats.
      run: |
        go test -count 3 -race -coverprofile coverage.txt -covermode atomic ./pkg/...
        sed -i -e '/_requestgen.go/d' coverage.txt

    - name: TestDnum
      run: |
        go test -race -coverprofile coverage_dnum.txt -covermode atomic -tags dnum ./pkg/...
        sed -i -e '/_requestgen.go/d' coverage_dnum.txt

    - name: Revive Check
      uses: morphy2k/revive-action@v2.7.8 # https://github.com/mgechev/revive/issues/956
      with:
        reporter: github-pr-review
        fail_on_error: true

    - name: Upload Coverage Report
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.txt,./coverage_dnum.txt

# NOTE: this workflow used to end with a "Create dotenv file" step that wrote
# DB_DRIVER and DB_DSN into .env.local. It has been removed: it ran after the
# test steps, so nothing ever read it.
#
# It also would not have worked if moved earlier. The database-backed tests —
# pkg/strategy/xfundingv2/round_record_test.go, for one — skip themselves based
# on os.LookupEnv("DB_DSN"), and never load .env.local, so a file on disk is
# invisible to them. Writing to $GITHUB_ENV instead, before the test step, is
# what would actually enable them:
#
#     - name: Configure database access for the DB-backed tests
#       run: |
#         echo "DB_DRIVER=mysql" >> "$GITHUB_ENV"
#         echo "DB_DSN=root:root@/bbgo" >> "$GITHUB_ENV"
#
# That is left out on purpose. Those tests have never run in CI, so turning
# them on here is a behaviour change with an unknown outcome rather than a fix,
# even though the MySQL service above is already provisioned and migrated for
# exactly this purpose.
