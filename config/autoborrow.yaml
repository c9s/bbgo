---
sessions:
  binance_margin:
    exchange: binance
    envVarPrefix: BINANCE
    margin: true

exchangeStrategies:
- on: binance_margin
  autoborrow:
    interval: 30m
    autoRepayWhenDeposit: true

    # minMarginRatio for triggering auto borrow
    # we trigger auto borrow only when the margin ratio is above the number
    minMarginLevel: 3.0

    # maxMarginRatio for stop auto-repay
    # if the margin ratio is high enough, we don't have the urge to repay
    maxMarginLevel: 20.0

    marginRepayAlert:
      slack:
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    marginHighInterestRateAlert:
      interval: 5m
      minAnnualInterestRate: "5%"
      slack:
        channel: "channel_id"
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    marginLevelAlert:
      interval: 5m
      minMargin: 2.0
      slack:
        channel: "channel_id"
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    assets:
    # Binance's userMinBorrow is queried from /sapi/v1/margin/allAssets (weight 1)
    # for each positive borrow candidate. Non-borrowable assets are skipped.
    # Query failures or missing/null userMinBorrow warn and continue with the configured floor.
    # Optional minQuantityPerBorrow sets a stricter floor in asset units (default zero).
    # After all caps are applied, smaller requests are skipped, not rounded up.
    - asset: ETH
      low: 3.0
      maxQuantityPerBorrow: 1.0
      maxTotalBorrow: 10.0

    - asset: USDT
      low: 1000.0
      maxQuantityPerBorrow: 100.0
      maxTotalBorrow: 10.0
