---
sessions:
  binance_margin:
    exchange: binance
    envVarPrefix: BINANCE
    margin: true

exchangeStrategies:
- on: binance_margin
  autoborrow:
    interval: 30m
    autoRepayWhenDeposit: true
    marginAssetInfoCacheTTL: 30m

    # minMarginRatio for triggering auto borrow
    # we trigger auto borrow only when the margin ratio is above the number
    minMarginLevel: 3.0

    # maxMarginRatio for stop auto-repay
    # if the margin ratio is high enough, we don't have the urge to repay
    maxMarginLevel: 20.0

    # interestEstimate logs and exports (Prometheus) the margin interest of the `assets` below,
    # borrowed or not (a debt of another asset is not counted, only warned), in USDT, counted in hourly charges:
    # - the UTC calendar month: interest projected on the current principal until the month end,
    #   plus the interest already charged this month (synced into the database, needs a configured DB).
    #   On Binance, interest paid with BNB deduction counts toward the borrowed asset, valued at the BNB charged.
    # - rolling months of 30 x 24 hours: the current principal projected over the next n x 720 hours.
    interestEstimate:
      interval: 5m
      syncInterval: 1h
      # charged: value realized interest at the price when it was charged (default)
      # current: value it at the current price
      realizedPriceMode: charged
      # rolling months to project, 1 and 3 by default (720 and 2160 hours)
      projectionMonths: [1, 3]
      # budget: interest budgets per UTC calendar month, in USDT: one for the whole session (over all
      # `assets`), and one per asset. Each is optional, and they are independent of each other.
      # A budget only reports a status (log and Prometheus): exceeded (already charged more),
      # projected_exceeded (will be over at the month end if nothing changes), ok, or unknown (within the
      # budget, but the estimate is incomplete). It does not alert and does not change how autoborrow
      # borrows or repays. It compares what was charged, at the price when charged, whatever
      # realizedPriceMode is. A session has its budgets in one autoborrow instance only.
      # budget:
      #   monthlyUSDT: 1000   # the whole session; 0 or not set: no budget
      #   assets:             # per asset, each has to be one of the `assets` below
      #     USDT: 600
      #     ETH: 300

    marginRepayAlert:
      slack:
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    marginHighInterestRateAlert:
      interval: 5m
      minAnnualInterestRate: "5%"
      slack:
        channel: "channel_id"
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    # interestBudgetAlert posts one live Slack message per session when a budget of
    # interestEstimate.budget is exceeded or projected to be exceeded. The message lists every budget
    # with its status and is updated in place; it is resolved when no budget is over any more.
    # It only tells you: nothing is repaid, and borrowing does not change. It needs a budget.
    # interestBudgetAlert:
    #   slack:
    #     channel: "channel_id"
    #     mentions:
    #     - '<@USER_ID>'
    #     - '<!subteam^TEAM_ID>'

    marginLevelAlert:
      interval: 5m
      minMargin: 2.0
      slack:
        channel: "channel_id"
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    assets:
    - asset: ETH
      low: 3.0
      maxQuantityPerBorrow: 1.0
      maxTotalBorrow: 10.0

    - asset: USDT
      low: 1000.0
      maxQuantityPerBorrow: 100.0
      maxTotalBorrow: 10.0

