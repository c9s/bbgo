---
sessions:
  binance_margin:
    exchange: binance
    envVarPrefix: BINANCE
    margin: true

exchangeStrategies:
- on: binance_margin
  autoborrow:
    interval: 30m
    autoRepayWhenDeposit: true
    marginAssetInfoCacheTTL: 30m

    # minMarginRatio for triggering auto borrow
    # we trigger auto borrow only when the margin ratio is above the number
    minMarginLevel: 3.0

    # maxMarginRatio for stop auto-repay
    # if the margin ratio is high enough, we don't have the urge to repay
    maxMarginLevel: 20.0

    # interestEstimate logs and exports (Prometheus) the margin interest of the `assets` below,
    # borrowed or not (a debt of another asset is not counted, only warned), in USDT, counted in hourly charges:
    # - the UTC calendar month: interest projected on the current principal until the month end,
    #   plus the interest already charged this month (synced into the database, needs a configured DB).
    #   On Binance, interest paid with BNB deduction counts toward the borrowed asset, valued at the BNB charged.
    # - rolling months of 30 x 24 hours: the current principal projected over the next n x 720 hours.
    interestEstimate:
      interval: 5m
      syncInterval: 1h
      # charged: value realized interest at the price when it was charged (default)
      # current: value it at the current price
      realizedPriceMode: charged
      # rolling months to project, 1 and 3 by default (720 and 2160 hours)
      projectionMonths: [1, 3]

    marginRepayAlert:
      slack:
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    marginHighInterestRateAlert:
      interval: 5m
      minAnnualInterestRate: "5%"
      slack:
        channel: "channel_id"
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    marginLevelAlert:
      interval: 5m
      minMargin: 2.0
      slack:
        channel: "channel_id"
        mentions:
        - '<@USER_ID>'
        - '<!subteam^TEAM_ID>'

    assets:
    - asset: ETH
      low: 3.0
      maxQuantityPerBorrow: 1.0
      maxTotalBorrow: 10.0

    - asset: USDT
      low: 1000.0
      maxQuantityPerBorrow: 100.0
      maxTotalBorrow: 10.0

